<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>萌宠小屋 · V8 重设计预览</title>
<style>
:root{
  --cream:#FFF6EC;
  --cream-2:#FFEFE0;
  --berry:#9B5DE5;
  --berry-soft:#C89DF0;
  --berry-deep:#7B3FA0;
  --mint:#A8E6CF;
  --mint-deep:#6FCF97;
  --peach:#FFB5A7;
  --peach-deep:#FF8C7A;
  --ink:#5C4A3A;
  --ink-soft:#9A8674;
  --card:rgba(255,255,255,.78);
  --shadow:0 10px 30px rgba(123,63,160,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--cream);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.app{
  position:relative;width:100vw;height:100vh;max-width:430px;margin:0 auto;
  background:var(--cream);overflow:hidden;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ===== 顶部导航 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 8px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--berry-deep)}
.brand .dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--berry),var(--peach));display:grid;place-items:center;font-size:15px}
.stars{display:flex;align-items:center;gap:4px;background:var(--card);padding:6px 12px;border-radius:20px;font-weight:700;color:var(--berry-deep);box-shadow:var(--shadow)}
.stars b{color:var(--peach-deep)}

/* ===== 主页（概览）===== */
#home{background:radial-gradient(120% 80% at 50% -10%,var(--cream-2),var(--cream))}
.home-hero{
  margin:10px 18px;padding:20px;border-radius:26px;
  background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:16px;
}
.mini-pet{
  width:90px;height:90px;border-radius:22px;flex:none;
  background:linear-gradient(135deg,#FFF8E7,#FFE8CC);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.06);
}
.mini-pet img{width:78px;height:78px;object-fit:contain;border-radius:14px}
.hero-info{flex:1;min-width:0}
.hero-name{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}
.hero-name .edit{font-size:13px;color:var(--ink-soft);cursor:pointer;background:none;border:none}
.hero-stage{font-size:13px;color:var(--ink-soft);margin-top:2px;font-weight:600}
.expbar{height:9px;border-radius:6px;background:#eee;margin-top:9px;overflow:hidden}
.expbar>i{display:block;height:100%;width:38%;border-radius:6px;background:linear-gradient(90deg,var(--berry),var(--peach))}

.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:6px 18px;margin-top:6px}
.tile{
  background:var(--card);border-radius:20px;padding:15px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:6px;
}
.tile .ic{font-size:26px}
.tile .t{font-weight:700;font-size:14px}
.tile .s{font-size:11px;color:var(--ink-soft)}
.tile.go{grid-column:1/-1;background:linear-gradient(135deg,var(--berry),var(--berry-deep));color:#fff;align-items:center;flex-direction:row;justify-content:center;gap:10px;padding:16px;font-weight:800;font-size:16px;box-shadow:0 12px 26px rgba(123,63,160,.35)}
.tile.go .s{color:rgba(255,255,255,.8)}

.home-foot{margin-top:auto;padding:14px 18px 22px;display:flex;gap:10px}
.foot-btn{flex:1;text-align:center;padding:13px;border-radius:18px;font-weight:700;font-size:14px;background:var(--card);box-shadow:var(--shadow)}

/* ===== 成长进化条（主页）===== */
.evo-bar{margin:10px 18px 2px}
.evo-bar-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.evo-steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.evo-step{flex:none;width:64px;text-align:center;opacity:.35;transition:.25s;cursor:pointer}
.evo-step.on{opacity:1}
.evo-step.done{opacity:.65}
.evo-step .evo-img{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#FFF8E7,#FFE8CC);display:grid;place-items:center;overflow:hidden;margin:0 auto 3px;border:2px solid transparent;transition:.2s}
.evo-step.on .evo-img{border-color:var(--berry);box-shadow:0 4px 12px rgba(155,93,229,.3)}
.evo-step .evo-img img{width:48px;height:48px;object-fit:contain}
.evo-step .evo-nm{font-size:10px;font-weight:700;color:var(--ink)}
.evo-step.on .evo-nm{color:var(--berry-deep)}
.evo-step .evo-lv{font-size:9px;color:var(--ink-soft)}

/* ===== 大房间 ===== */
#room{background:var(--berry-deep)}
.scene{position:absolute;inset:0;transition:background .7s ease;overflow:hidden}
.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 120%,rgba(0,0,0,.18),transparent 60%)}
.scene-deco{position:absolute;bottom:0;left:0;right:0;height:42%;opacity:.85;pointer-events:none}

.room-top{position:relative;z-index:3;display:flex;justify-content:space-between;padding:16px 18px}
.back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow);cursor:pointer}
.room-title{background:rgba(255,255,255,.85);padding:7px 16px;border-radius:20px;font-weight:800;color:var(--berry-deep);box-shadow:var(--shadow)}

.stage-wrap{position:relative;z-index:3;flex:1;display:grid;place-items:center}
.pet-stage{position:relative;width:220px;height:220px;display:grid;place-items:center}
.pet-img{
  width:170px;height:170px;object-fit:contain;cursor:pointer;user-select:none;
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));
  animation:float 3.2s ease-in-out infinite;
  transition:transform .2s;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.pet-img.wobble{animation:wobble .6s ease}
@keyframes wobble{0%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.04)}50%{transform:rotate(10deg) scale(1.04)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
.bubble{
  position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);
  background:#fff;color:var(--ink);padding:9px 14px;border-radius:16px;font-size:13px;font-weight:600;
  white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;box-shadow:var(--shadow);pointer-events:none;
}
.bubble.show{opacity:1;transform:translate(-50%,-115%)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}

/* 房间内进化预览 */
.room-evo{position:relative;z-index:3;padding:0 18px 8px}
.room-evo-title{font-size:11px;color:rgba(255,255,255,.75);text-align:center;margin-bottom:8px;font-weight:700}
.room-evo-stages{display:flex;gap:8px;overflow-x:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.re-stage{flex:none;width:68px;text-align:center;opacity:.4;transition:.25s}
.re-stage.cur{opacity:1}
.re-stage.past{opacity:.65}
.re-stage .re-img{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.92);display:grid;place-items:center;overflow:hidden;margin:0 auto 3px;border:2px solid transparent}
.re-stage.cur .re-img{border-color:#FFD700;box-shadow:0 4px 14px rgba(255,215,0,.4)}
.re-stage .re-img img{width:48px;height:48px;object-fit:contain}
.re-stage .re-nm{font-size:10px;color:#fff;font-weight:700}
.re-stage .re-lv{font-size:9px;color:rgba(255,255,255,.6)}

.scene-bar{position:relative;z-index:3;display:flex;gap:10px;padding:10px 18px 22px;overflow-x:auto}
.scene-chip{flex:none;width:62px;text-align:center;font-size:12px;color:#fff;opacity:.6;transition:.25s}
.scene-chip .e{width:46px;height:46px;margin:0 auto 4px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(255,255,255,.2)}
.scene-chip.on{opacity:1}
.scene-chip.on .e{background:rgba(255,255,255,.92);box-shadow:0 6px 14px rgba(0,0,0,.2)}
.scene-chip.locked{opacity:.35}
.scene-chip.locked .e{background:rgba(0,0,0,.25)}

.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.7);z-index:3}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 主页（概览）===== -->
  <section id="home" class="screen active">
    <div class="topbar">
      <div class="brand"><span class="dot">🏡</span>萌宠小屋</div>
      <div class="stars">⭐ <b>248</b></div>
    </div>

    <div class="home-hero">
      <div class="mini-pet">
        <img id="heroPetImg" src="pets/snake-l3-baby.png" alt="小蛇蛇">
      </div>
      <div class="hero-info">
        <div class="hero-name">小蛇蛇 <button class="edit" onclick="rename()" title="改名">✏️</button></div>
        <div class="hero-stage">Lv.3 · 萌萌小蛇 🌱</div>
        <div class="expbar"><i></i></div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:5px">今日打卡 3/5 · 还差 2 个就升级啦</div>
      </div>
    </div>

    <!-- 6级成长进化条 -->
    <div class="evo-bar">
      <div class="evo-bar-label">🐣 成长之路（点击切换等级预览）</div>
      <div class="evo-steps" id="homeEvoSteps"></div>
    </div>

    <div class="home-grid">
      <div class="tile"><div class="ic">✅</div><div class="t">今日打卡</div><div class="s">3/5 习惯进行中</div></div>
      <div class="tile"><div class="ic">🎨</div><div class="t">我的画作</div><div class="s">12 幅作品</div></div>
      <div class="tile"><div class="ic">🎁</div><div class="t">盲盒扭蛋</div><div class="s">抽中 5 只宠物</div></div>
      <div class="tile"><div class="ic">🛍️</div><div class="t">装扮商城</div><div class="s">美食 / 家具</div></div>
      <div class="tile go" id="enterRoom"><span>🚪 进入大房间</span><span class="s">看看小蛇的家</span></div>
    </div>

    <div class="home-foot">
      <div class="foot-btn">💬 聊天</div>
      <div class="foot-btn">⚙️ 设置</div>
      <div class="foot-btn">📖 记录</div>
    </div>
  </section>

  <!-- ===== 大房间 ===== -->
  <section id="room" class="screen">
    <div class="scene" id="scene"></div>
    <div class="room-top">
      <div class="back" id="backHome">←</div>
      <div class="room-title" id="sceneName">🌳 森林小屋</div>
    </div>
    <div class="stage-wrap">
      <div class="pet-stage">
        <div class="bubble" id="bubble">今天也要加油鸭！🐍</div>
        <img class="pet-img" id="roomPetImg" src="pets/snake-l3-baby.png" alt="小蛇蛇">
      </div>
    </div>

    <!-- 房间内成长进化预览 -->
    <div class="room-evo">
      <div class="room-evo-title">✨ 进化图鉴 — 小蛇蛇的成长轨迹</div>
      <div class="room-evo-stages" id="roomEvoStages"></div>
    </div>

    <div class="scene-bar" id="sceneBar"></div>
    <div class="hint">点小蛇会摇一摇 · 底部可切换主题背景 · 查看完整成长轨迹</div>
  </section>

</div>

<script>
// ========== 小蛇蛇 6 级成长数据 ==========
const SNAKE_LEVELS = [
  {lv:1, name:'破壳蛋', emoji:'🥚', img:'pets/snake-l1-egg.png', expMax:0, desc:'一颗神秘的蛋，等着你用心孵化～'},
  {lv:2, name:'破壳幼蛇', emoji:'🐣', img:'pets/snake-l2-hatch.png', expMax:10, desc:'破壳啦！软萌的小幼蛇需要照顾'},
  {lv:3, name:'萌萌小蛇', emoji:'🌱', img:'pets/snake-l3-baby.png', expMax:30, desc:'头顶小叶子，圆滚滚超可爱'},
  {lv:4, name:'贪吃小蛇', emoji:'🌽', img:'pets/snake-l4-corn.png', expMax:60, desc:'抱着玉米不肯放，吃货属性暴露了'},
  {lv:5, name:'学霸小蛇', emoji:'🎒', img:'pets/snake-l5-student.png', expMax:120, desc:'背书包拿铅笔，爱学习的乖宝宝'},
  {lv:6, name:'毕业小蛇', emoji:'🎓', img:'pets/snake-l6-grad.png', expMax:9999, desc:'戴学士帽！最大的骄傲～'},
];
let curLevel = 3; // 当前等级（演示默认 Lv.3）

const SCENES = {
  forest:{name:'森林小屋',emoji:'🌳',bg:'linear-gradient(180deg,#Bfe3c0 0%,#7FCB8A 45%,#4E9E63 100%)',
    deco:'<svg class="scene-deco" viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M0 200 L0 120 Q60 70 120 120 Q180 60 250 120 Q320 70 400 120 L400 200 Z" fill="rgba(40,90,50,.35)"/><path d="M0 200 L0 150 Q80 110 160 150 Q260 110 400 150 L400 200 Z" fill="rgba(30,70,40,.4)"/></svg>'},
  ocean:{name:'海洋世界',emoji:'🌊',bg:'linear-gradient(180deg,#A6E3F0 0%,#5BB8D6 45%,#2E7FB0 100%)',
    deco:'<svg class="scene-deco" viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M0 200 L0 150 Q50 120 100 150 T200 150 T300 150 T400 150 L400 200 Z" fill="rgba(255,255,255,.18)"/><path d="M0 200 L0 170 Q60 145 120 170 T240 170 T400 170 L400 200 Z" fill="rgba(255,255,255,.12)"/></svg>'},
  castle:{name:'梦幻城堡',emoji:'🏰',bg:'linear-gradient(180deg,#F3C7E8 0%,#C98BD8 45%,#8E4FB0 100%)',
    deco:'<svg class="scene-deco" viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M120 200 L120 90 L150 90 L150 70 L170 70 L170 90 L230 90 L230 70 L250 70 L250 90 L280 90 L280 200 Z" fill="rgba(80,40,110,.35)"/></svg>'},
  star:{name:'星空秘境',emoji:'🌌',bg:'linear-gradient(180deg,#3A2E6E 0%,#5B4B9E 45%,#1E1740 100%)',
    deco:'<svg class="scene-deco" viewBox="0 0 400 200" preserveAspectRatio="none"><g fill="rgba(255,255,255,.85)"><circle cx="60" cy="40" r="2.5"/><circle cx="140" cy="70" r="2"/><circle cx="220" cy="35" r="2.8"/><circle cx="300" cy="80" r="2"/><circle cx="360" cy="50" r="2.4"/><circle cx="100" cy="110" r="1.6"/><circle cx="260" cy="120" r="1.8"/></g></svg>'}
};
let curScene = 'forest';

// 宠物对话
const WORDS_BY_LEVEL = {
  1:['快快孵化我吧～好想见你呀！','再陪我多读一本书好不好？'],
  2:['哇！我出来啦！世界好大啊～','抱抱我，我有点怕生'],
  3:['今天也要加油鸭！🐍','陪我玩一会儿嘛~'],
  4:['玉米好好吃！你也来一口？','吃饱饱才有力气学习哦'],
  5:['这道题我会！让我来教你吧','打卡完成啦，好开心！'],
  6:['毕业啦！谢谢你一直陪着我','我们一起学拼音吧！'],
};

// ========== 渲染进化条 ==========
function renderHomeEvo(){
  const bar=document.getElementById('homeEvoSteps');
  bar.innerHTML='';
  SNAKE_LEVELS.forEach((l,i)=>{
    const step=document.createElement('div');
    const state=i+1<curLevel?'done':i+1===curLevel?'on':'';
    step.className='evo-step '+state;
    step.innerHTML=`<div class="evo-img"><img src="${l.img}" alt="${l.name}"></div><div class="evo-nm">${l.name}</div><div class="evo-lv">Lv.${l.lv}</div>`;
    if(i+1<=curLevel) step.onclick=()=>switchLevel(l.lv);
    bar.appendChild(step);
  });
}
function renderRoomEvo(){
  const bar=document.getElementById('roomEvoStages');
  bar.innerHTML='';
  SNAKE_LEVELS.forEach((l,i)=>{
    const st=document.createElement('div');
    const state=i+1<curLevel?'past':i+1===curLevel?'cur':'';
    st.className='re-stage '+state;
    st.innerHTML=`<div class="re-img"><img src="${l.img}" alt="${l.name}"></div><div class="re-nm">${l.name}</div><div class="re-lv">Lv.${l.lv} ${l.emoji}</div>`;
    if(i+1<=curLevel) st.onclick=()=>switchLevel(l.lv);
    bar.appendChild(st);
  });
}

// ========== 切换等级 ==========
function switchLevel(lv){
  curLevel=lv;
  const l=SNAKE_LEVELS[lv-1];
  // 更新主页
  document.getElementById('heroPetImg').src=l.img;
  document.querySelector('.hero-stage').textContent=`Lv.${l.lv} · ${l.name} ${l.emoji}`;
  // 更新房间
  document.getElementById('roomPetImg').src=l.img;
  // 更新进化条状态
  renderHomeEvo();
  renderRoomEvo();
}

// ========== 场景切换 ==========
function setScene(key){
  curScene=key;
  const s=SCENES[key];
  document.getElementById('scene').style.background=s.bg;
  document.getElementById('scene').innerHTML=s.deco;
  document.getElementById('sceneName').textContent=s.emoji+' '+s.name;
  // 场景栏
  const sb=document.getElementById('sceneBar');
  sb.innerHTML='';
  Object.entries(SCENES).forEach(([k,v])=>{
    const chip=document.createElement('div');
    chip.className='scene-chip'+(k===curScene?' on':'')+(false?' locked':'');
    chip.innerHTML=`<div class="e">${v.emoji}</div>${v.name}`;
    if(k!==key) chip.onclick=()=>setScene(k);
    sb.appendChild(chip);
  });
}

// ========== 宠物互动 ==========
const roomPetImg=document.getElementById('roomPetImg');
const bubble=document.getElementById('bubble');
roomPetImg.onclick=()=>{
  roomPetImg.classList.remove('wobble');void roomPetImg.offsetWidth;roomPetImg.classList.add('wobble');
  const words=WORDS_BY_LEVEL[curLevel]||WORDS_BY_LEVEL[3];
  bubble.textContent=words[Math.floor(Math.random()*words.length)];
  bubble.classList.add('show');
  clearTimeout(roomPetImg._t);roomPetImg._t=setTimeout(()=>bubble.classList.remove('show'),1800);
};

// ========== 导航 ==========
document.getElementById('enterRoom').onclick=()=>{
  document.getElementById('home').classList.remove('active');
  document.getElementById('room').classList.add('active');
  setScene(curScene);
};
document.getElementById('backHome').onclick=()=>{
  document.getElementById('room').classList.remove('active');
  document.getElementById('home').classList.add('active');
};

// ========== 改名 ==========
function rename(){
  const n=prompt('给小蛇蛇起个名字：','小蛇蛇');
  if(n) document.querySelector('.hero-name').childNodes[0].textContent=n+' ';
}

// ========== 初始化 ==========
renderHomeEvo();
renderRoomEvo();
setScene('forest');
</script>
</body>
</html>
