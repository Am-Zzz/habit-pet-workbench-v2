<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>糖糖语文乐园 · 一年级上册闯关小游戏</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --cream:#FFF8F3;
  --cocoa:#5A4141;
  --cocoa-l:#8A6A6A;
  --pink:#FFD0E2;
  --pink-m:#FF9EC4;
  --pink-d:#F26B9D;
  --straw:#FF5F95;
  --mint:#A8E0C4;
  --mint-d:#4FBF93;
  --lemon:#FFF1C4;
  --lemon-d:#F5C94C;
  --sky:#BFDCFF;
  --sky-d:#6FA8E8;
  --grape:#C9B8F0;
  --grape-d:#8F76D6;
  --font-display:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body);
  color:var(--cocoa);
  background:linear-gradient(160deg,#FFE7F0 0%,#F3EBFF 55%,#E3F3FF 100%);
  background-attachment:fixed;
  line-height:1.6;
  overflow-x:hidden;
}
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  background:linear-gradient(180deg,#FFF0F6 0%,#FFF6F2 45%,#EFF8FF 100%);
  position:relative;
  box-shadow:0 0 40px rgba(210,150,180,.25);
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
@media(min-width:600px){
  #app{border-radius:0 0 32px 32px}
}
.hidden{display:none!important}

/* ===== 通用按钮 ===== */
.btn{
  font-family:var(--font-display);
  border:none;cursor:pointer;
  border-radius:999px;
  padding:14px 26px;
  font-size:19px;
  color:#fff;
  background:linear-gradient(180deg,#FFB1CD,#FF8FB7);
  box-shadow:0 6px 0 #E56A97,0 10px 18px rgba(242,107,157,.35);
  transition:transform .12s,box-shadow .12s;
  letter-spacing:.06em;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #E56A97}
.btn:focus-visible{outline:3px solid var(--grape-d);outline-offset:2px}
.btn-secondary{
  background:linear-gradient(180deg,#D9ECFF,#BFDCFF);
  box-shadow:0 6px 0 #8FB8E8,0 10px 18px rgba(111,168,232,.3);
  color:#4A6E9C;
}
.btn-mint{
  background:linear-gradient(180deg,#C4EBD8,#A8E0C4);
  box-shadow:0 6px 0 #6FC49C,0 10px 18px rgba(79,191,147,.28);
  color:#2E7D5C;
}
.btn-lemon{
  background:linear-gradient(180deg,#FFE9A8,#F5C94C);
  box-shadow:0 6px 0 #D9A92F,0 10px 18px rgba(245,201,76,.3);
  color:#8A6A1F;
}
.btn-grape{
  background:linear-gradient(180deg,#DCD0F7,#C9B8F0);
  box-shadow:0 6px 0 #9C84D6,0 10px 18px rgba(143,118,214,.3);
  color:#5E4A96;
}
.btn-ghost{
  background:#fff;
  box-shadow:0 4px 0 #EFE3EA,0 8px 14px rgba(200,160,180,.2);
  color:var(--cocoa-l);
  font-size:15px;
  padding:10px 18px;
}
.btn-danger{
  background:linear-gradient(180deg,#FFC2B8,#FF9E8E);
  box-shadow:0 6px 0 #E57A66,0 10px 18px rgba(229,122,102,.3);
  color:#8A3A2A;
}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-block{display:block;width:100%;text-align:center}

/* ===== 顶栏 ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 6px;
}
.topbar .tb-title{
  font-family:var(--font-display);font-size:22px;color:var(--pink-d);
  letter-spacing:.04em;
}
.icon-btn{
  width:44px;height:44px;border-radius:50%;
  border:none;cursor:pointer;
  background:#fff;
  box-shadow:0 3px 0 #EFE3EA,0 6px 12px rgba(200,160,180,.22);
  display:flex;align-items:center;justify-content:center;
  color:var(--cocoa-l);
  transition:transform .12s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn:focus-visible{outline:3px solid var(--grape-d)}
.icon-btn svg{width:22px;height:22px}

/* ===== 首页 ===== */
.banner{
  position:relative;
  margin:8px 14px 0;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(210,150,180,.28);
}
.banner img{display:block;width:100%;height:auto}
.banner .banner-mask{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,240,246,.05) 30%,rgba(255,240,246,.85) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px 18px 14px;
}
.banner h1{
  font-family:var(--font-display);
  font-size:30px;color:var(--pink-d);
  text-shadow:0 2px 0 #fff;
  letter-spacing:.08em;
}
.banner p{font-size:13px;color:var(--cocoa-l);text-shadow:0 1px 0 #fff}

.stat-chips{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;padding:14px 14px 4px;
}
.stat-chip{
  background:#fff;border-radius:18px;
  box-shadow:0 4px 0 #F3E7EE,0 8px 14px rgba(200,160,180,.18);
  padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.stat-chip .chip-icon{width:26px;height:26px}
.stat-chip .chip-num{
  font-family:var(--font-display);font-size:20px;color:var(--cocoa);
  line-height:1.2;
}
.stat-chip .chip-label{font-size:11px;color:var(--cocoa-l)}

/* 兔兔舞台 */
.stage{
  position:relative;
  margin:6px 14px 0;
  min-height:290px;
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;
}
.stage .pet-wrap{position:relative;z-index:2;width:230px}
.stage .cloud-ped{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:300px;z-index:1;
}
.stage .deco{
  position:absolute;z-index:0;
  animation:float 3.6s ease-in-out infinite;
}
.stage .deco.d1{top:6%;left:6%;animation-delay:.2s}
.stage .deco.d2{top:16%;right:4%;animation-delay:.9s}
.stage .deco.d3{top:52%;left:2%;animation-delay:1.6s}
.stage .deco.d4{top:60%;right:1%;animation-delay:2.3s}
.stage .deco svg{width:30px;height:30px}
.stage .deco.d2 svg{width:24px;height:24px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.pet-info{text-align:center;padding:4px 14px 0;z-index:2;position:relative}
.pet-info .pet-name{
  font-family:var(--font-display);font-size:24px;color:var(--pink-d);
}
.pet-info .pet-title{
  display:inline-block;background:linear-gradient(180deg,#FFE3A8,#F5C94C);
  color:#7A5A14;font-size:13px;border-radius:999px;padding:3px 14px;
  margin:4px 0;box-shadow:0 3px 0 #D9A92F;
}
.pet-info .pet-say{font-size:14px;color:var(--cocoa-l);min-height:24px}
.minute-bar{
  display:flex;align-items:center;gap:8px;
  background:#fff;margin:12px 14px 0;border-radius:18px;
  padding:10px 14px;box-shadow:0 4px 0 #F3E7EE,0 8px 14px rgba(200,160,180,.18);
}
.minute-bar svg{width:22px;height:22px;color:var(--mint-d);flex:none}
.minute-bar .mb-text{font-size:13px;color:var(--cocoa-l);flex:1;white-space:nowrap}
.minute-track{height:12px;border-radius:999px;background:#F3E7EE;flex:1.2;overflow:hidden}
.minute-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#A8E0C4,#4FBF93);transition:width .6s}

.home-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:16px 14px 10px;
}
.home-actions .btn{padding:18px 10px;font-size:22px}
.home-sub{
  display:flex;justify-content:center;gap:12px;
  padding:4px 14px 28px;
}
.home-sub .btn{padding:10px 20px;font-size:15px}

/* ===== 视图切换 ===== */
.view{display:none;animation:viewIn .28s ease}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page{padding:4px 16px 30px}
.page-title{
  font-family:var(--font-display);font-size:26px;color:var(--pink-d);
  text-align:center;padding:10px 0 4px;
}
.page-sub{text-align:center;font-size:13px;color:var(--cocoa-l);margin-bottom:12px}

/* ===== 闯关地图 ===== */
.map-path{padding:10px 0 6px}
.map-node{
  position:relative;
  display:flex;align-items:center;gap:14px;
  background:#fff;border-radius:22px;
  margin:0 4px 20px;padding:14px;
  box-shadow:0 5px 0 #F3E7EE,0 10px 18px rgba(200,160,180,.2);
  cursor:pointer;transition:transform .12s;
  border:3px solid transparent;
}
.map-node:active{transform:scale(.98)}
.map-node.locked{opacity:.72;filter:grayscale(.4);cursor:not-allowed}
.map-node.open{border-color:var(--pink)}
.map-node.passed{border-color:var(--mint)}
.map-node .node-icon{
  width:58px;height:58px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);
}
.map-node .node-icon svg{width:30px;height:30px}
.map-node .node-main{flex:1;min-width:0}
.map-node .node-unit{font-size:11px;color:var(--cocoa-l);letter-spacing:.05em}
.map-node .node-title{font-family:var(--font-display);font-size:19px;color:var(--cocoa)}
.map-node .node-stars{display:flex;gap:3px;margin-top:3px}
.map-node .node-stars svg{width:17px;height:17px}
.map-node .node-state{flex:none;font-size:12px;color:var(--cocoa-l)}
.map-node .node-state .badge{
  display:inline-block;background:linear-gradient(180deg,#FFE9A8,#F5C94C);
  color:#7A5A14;border-radius:999px;padding:3px 12px;font-size:12px;
  box-shadow:0 3px 0 #D9A92F;
}

/* ===== 答题闯关 ===== */
.quiz-top{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 4px;
}
.quiz-top .qt-info{flex:1;min-width:0}
.quiz-top .qt-unit{font-size:11px;color:var(--cocoa-l)}
.quiz-top .qt-title{font-family:var(--font-display);font-size:20px;color:var(--pink-d);line-height:1.2}
.quiz-hearts{display:flex;gap:4px}
.quiz-hearts svg{width:24px;height:24px;transition:transform .3s}
.quiz-hearts svg.lost{transform:scale(.7);opacity:.35}
.quiz-progress{
  margin:8px 16px 2px;height:10px;border-radius:999px;background:#F3E7EE;overflow:hidden;
}
.quiz-progress .qp-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB1CD,#FF8FB7);transition:width .35s}
.quiz-progress-label{text-align:center;font-size:11px;color:var(--cocoa-l);margin:2px 0 8px}

.q-card{
  background:#fff;border-radius:24px;
  margin:0 14px;padding:22px 18px;
  box-shadow:0 6px 0 #F3E7EE,0 12px 20px rgba(200,160,180,.22);
  text-align:center;
}
.q-type{
  display:inline-block;font-size:12px;color:#fff;
  background:linear-gradient(180deg,#DCD0F7,#C9B8F0);
  border-radius:999px;padding:3px 14px;letter-spacing:.05em;
  box-shadow:0 3px 0 #9C84D6;
}
.q-prompt{font-family:var(--font-display);font-size:21px;color:var(--cocoa);margin-top:12px;min-height:32px}
.q-content{margin:14px 0 4px;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.q-content .big-char{font-family:var(--font-display);font-size:86px;color:var(--pink-d);line-height:1.1;text-shadow:0 4px 0 #FFE4EE}
.q-content .big-py{font-family:var(--font-display);font-size:58px;color:var(--sky-d);line-height:1.2;text-shadow:0 4px 0 #E3F1FF}
.q-content .pic-box{width:132px;height:132px;border-radius:24px;background:linear-gradient(180deg,#FFF6FA,#F3ECFF);display:flex;align-items:center;justify-content:center}
.q-content .pic-box svg{width:104px;height:104px}
.q-content .fill-sentence{font-family:var(--font-display);font-size:25px;color:var(--cocoa);line-height:1.7}
.q-content .fill-sentence .blank{
  display:inline-block;min-width:2.2em;border-bottom:4px solid var(--pink-m);
  color:var(--pink-d);
}
.q-content .class-list{font-family:var(--font-display);font-size:30px;color:var(--grape-d);letter-spacing:.15em}
.speak-btn{
  margin-top:6px;border:none;cursor:pointer;border-radius:999px;
  background:linear-gradient(180deg,#E3F1FF,#BFDCFF);color:#3E6CA0;
  box-shadow:0 4px 0 #8FB8E8;
  padding:8px 20px;font-size:14px;font-family:var(--font-display);
  display:inline-flex;align-items:center;gap:6px;
}
.speak-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8FB8E8}
.speak-btn svg{width:16px;height:16px}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 14px 0}
.opt{
  position:relative;
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:64px;border-radius:20px;border:3px solid #F3E7EE;
  background:#fff;cursor:pointer;font-family:var(--font-display);font-size:24px;color:var(--cocoa);
  box-shadow:0 5px 0 #F3E7EE;
  transition:transform .12s;
  padding:10px 8px;
}
.opt:active{transform:scale(.97)}
.opt:focus-visible{outline:3px solid var(--grape-d);outline-offset:2px}
.opt .opt-letter{
  position:absolute;top:6px;left:10px;font-size:11px;color:#CFB9C8;font-family:var(--font-body);
}
.opt .opt-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.opt .opt-main .opt-char{font-size:30px}
.opt .opt-main .opt-py{font-size:19px;color:var(--sky-d)}
.opt .opt-main svg{width:44px;height:44px}
.opt.correct{background:linear-gradient(180deg,#D8F5E6,#BDEBD2);border-color:#7FCBA4;color:#2E7D5C;box-shadow:0 5px 0 #7FCBA4;animation:pop .35s ease}
.opt.wrong{background:linear-gradient(180deg,#FFE3DE,#FFD2C9);border-color:#F5A08D;color:#A3482F;box-shadow:0 5px 0 #F5A08D;animation:shake .4s ease}
.opt.dim{opacity:.5}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

.feedback{
  margin:14px 14px 0;border-radius:18px;padding:12px 16px;
  font-size:15px;display:flex;align-items:flex-start;gap:10px;
  animation:viewIn .3s ease;
}
.feedback .fb-ico{flex:none;width:30px;height:30px;margin-top:2px}
.feedback.ok{background:linear-gradient(180deg,#E4F8EE,#D2F2E2);color:#2E7D5C}
.feedback.bad{background:linear-gradient(180deg,#FFF0EB,#FFE4DD);color:#A3482F}
.feedback .fb-text{flex:1}
.feedback .fb-text .fb-title{font-family:var(--font-display);font-size:17px}
.feedback .fb-text .fb-tip{font-size:13px;opacity:.9;margin-top:2px}
.quiz-bottom{padding:14px 14px 26px}
.quiz-bunny{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.quiz-bunny .mini-pet{width:64px;height:76px}
.quiz-bunny .qb-text{font-size:13px;color:var(--cocoa-l);max-width:260px}
.streak-badge{
  display:inline-block;background:linear-gradient(180deg,#FFE9A8,#F5C94C);
  color:#7A5A14;font-size:12px;border-radius:999px;padding:2px 12px;margin-left:8px;
  box-shadow:0 2px 0 #D9A92F;
}

/* ===== 弹窗 ===== */
.modal-mask{
  position:fixed;inset:0;z-index:60;
  background:rgba(90,65,65,.4);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#FFF9F5;border-radius:28px;
  box-shadow:0 20px 50px rgba(90,65,65,.35);
  width:100%;max-width:400px;padding:26px 22px;text-align:center;
  animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);
  max-height:86vh;overflow-y:auto;
}
@keyframes modalIn{from{opacity:0;transform:scale(.8) translateY(20px)}to{opacity:1;transform:none}}
.modal .m-ico{margin-bottom:10px}
.modal .m-ico svg{width:64px;height:64px}
.modal .m-title{font-family:var(--font-display);font-size:26px;color:var(--pink-d)}
.modal .m-text{font-size:15px;color:var(--cocoa-l);margin:10px 0 4px;white-space:pre-line}
.modal .m-actions{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.modal .m-row{display:flex;gap:12px}
.modal .m-row .btn{flex:1;padding:12px 8px;font-size:16px}
.star-row{display:flex;justify-content:center;gap:8px;margin:10px 0}
.star-row svg{width:44px;height:44px;animation:starIn .5s ease both}
.star-row svg:nth-child(2){animation-delay:.15s}
.star-row svg:nth-child(3){animation-delay:.3s}
.star-row svg.off{opacity:.25;animation:none}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1) rotate(0)}}
.reward-line{font-family:var(--font-display);font-size:18px;color:var(--mint-d);margin-top:6px}
.reward-line .coin-ico{display:inline-block;width:20px;height:20px;vertical-align:-4px}

/* ===== 轻提示 ===== */
#toast-root{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:480px;padding:0 20px}
.toast{
  background:rgba(90,65,65,.92);color:#fff;font-size:14px;
  border-radius:999px;padding:10px 20px;max-width:100%;
  animation:toastIn .3s ease;text-align:center;
}
.toast.good{background:rgba(79,191,147,.95)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== 彩带 ===== */
.confetti{
  position:fixed;top:-18px;z-index:70;width:10px;height:16px;
  border-radius:3px;pointer-events:none;
  animation:confFall linear forwards;
}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:.85}}
.spark{
  position:fixed;z-index:70;pointer-events:none;
  animation:sparkPop .8s ease forwards;
}
@keyframes sparkPop{0%{transform:scale(0);opacity:1}70%{transform:scale(1.2);opacity:1}100%{transform:scale(.4);opacity:0}}

/* ===== 装扮小屋 ===== */
.dress-stage{
  background:linear-gradient(180deg,#FFF0F6,#EFF8FF);
  border-radius:26px;margin:8px 14px 0;
  padding:14px 10px 6px;position:relative;overflow:hidden;
  box-shadow:0 6px 0 #F3E7EE,0 12px 20px rgba(200,160,180,.2);
}
.dress-stage .d-pet{width:220px;margin:0 auto;cursor:pointer;transition:transform .15s}
.dress-stage .d-pet:active{transform:scale(.96)}
.dress-name{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px}
.dress-name input{
  border:3px solid #F3E7EE;border-radius:999px;padding:8px 16px;font-size:16px;
  font-family:var(--font-display);color:var(--cocoa);text-align:center;width:160px;outline:none;
}
.dress-name input:focus{border-color:var(--pink-m)}
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.shop-card{
  background:#fff;border-radius:22px;padding:14px;text-align:center;
  box-shadow:0 5px 0 #F3E7EE,0 10px 16px rgba(200,160,180,.18);
  border:3px solid transparent;
}
.shop-card.equipped{border-color:var(--mint)}
.shop-card .sc-ico{height:64px;display:flex;align-items:center;justify-content:center}
.shop-card .sc-ico svg{width:56px;height:56px}
.shop-card .sc-name{font-family:var(--font-display);font-size:17px;color:var(--cocoa)}
.shop-card .sc-price{font-size:12px;color:var(--cocoa-l);margin:2px 0 8px;display:flex;align-items:center;justify-content:center;gap:4px}
.shop-card .sc-price svg{width:14px;height:14px}
.shop-card .sc-btn{
  width:100%;border:none;cursor:pointer;border-radius:999px;padding:8px 6px;
  font-family:var(--font-display);font-size:14px;color:#fff;
  background:linear-gradient(180deg,#FFB1CD,#FF8FB7);box-shadow:0 4px 0 #E56A97;
  transition:transform .12s;
}
.shop-card .sc-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E56A97}
.shop-card .sc-btn.owned{background:linear-gradient(180deg,#C4EBD8,#A8E0C4);box-shadow:0 4px 0 #6FC49C;color:#2E7D5C}
.shop-card .sc-btn.equip{background:linear-gradient(180deg,#DCD0F7,#C9B8F0);box-shadow:0 4px 0 #9C84D6;color:#5E4A96}
.shop-card .sc-btn[disabled]{opacity:.5;pointer-events:none}

/* ===== 设置 ===== */
.set-card{
  background:#fff;border-radius:22px;padding:16px;margin:10px 0;
  box-shadow:0 5px 0 #F3E7EE,0 10px 16px rgba(200,160,180,.18);
}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.set-row .sr-label{font-size:15px;color:var(--cocoa);display:flex;align-items:center;gap:8px}
.set-row .sr-label svg{width:20px;height:20px;color:var(--pink-m)}
.set-row .sr-value{font-family:var(--font-display);color:var(--pink-d);font-size:18px;min-width:52px;text-align:right}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;
  background:linear-gradient(90deg,#FFB1CD,#FF8FB7);outline:none;margin-top:8px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;border:5px solid var(--pink-d);cursor:pointer;
  box-shadow:0 3px 8px rgba(242,107,157,.4);
}
.switch{position:relative;width:56px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;inset:0;border-radius:999px;background:#EBDCE6;transition:.25s;cursor:pointer;
}
.switch .slider:before{
  content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 6px rgba(90,65,65,.25);transition:.25s;
}
.switch input:checked + .slider{background:linear-gradient(90deg,#A8E0C4,#4FBF93)}
.switch input:checked + .slider:before{transform:translateX(24px)}
.set-note{font-size:12px;color:var(--cocoa-l);margin-top:6px;line-height:1.5}

/* ===== 学习报告 ===== */
.rep-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.rep-card{
  background:#fff;border-radius:22px;padding:16px;text-align:center;
  box-shadow:0 5px 0 #F3E7EE,0 10px 16px rgba(200,160,180,.18);
}
.rep-card .rc-ico{width:30px;height:30px;margin:0 auto 4px}
.rep-card .rc-num{font-family:var(--font-display);font-size:28px;color:var(--pink-d);line-height:1.2}
.rep-card .rc-label{font-size:12px;color:var(--cocoa-l)}
.level-progress{
  background:#fff;border-radius:22px;padding:16px;margin-top:12px;
  box-shadow:0 5px 0 #F3E7EE,0 10px 16px rgba(200,160,180,.18);
}
.level-progress .lp-title{font-family:var(--font-display);font-size:18px;color:var(--cocoa);margin-bottom:10px;text-align:center}
.lp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lp-item{text-align:center}
.lp-item .lp-ico{
  width:44px;height:44px;border-radius:50%;margin:0 auto 4px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.lp-item .lp-ico svg{width:22px;height:22px}
.lp-item .lp-name{font-size:10px;color:var(--cocoa-l)}
.lp-item .lp-stars{display:flex;justify-content:center;gap:2px;margin-top:2px}
.lp-item .lp-stars svg{width:12px;height:12px}
.lp-item .lp-stars svg.off{opacity:.22}
.acc-bar{margin-top:12px}
.acc-bar .ab-label{font-size:12px;color:var(--cocoa-l);display:flex;justify-content:space-between;margin-bottom:4px}
.acc-bar .ab-track{height:14px;border-radius:999px;background:#F3E7EE;overflow:hidden}
.acc-bar .ab-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFD34D,#F5C94C);transition:width .6s}

/* ===== 兔兔动画 ===== */
.pet-svg{display:block;width:100%;height:auto}
.bunny-happy .ear-l{animation:earWiggle 1.6s ease-in-out infinite;transform-origin:80px 120px}
@keyframes earWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}}
.bunny-happy{animation:bunnyBounce 2.2s ease-in-out infinite}
@keyframes bunnyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bunny-sad .ear-l{transform:rotate(14deg);transform-origin:80px 120px}
.bunny-sad .ear-r{transform:rotate(-14deg);transform-origin:120px 120px}
.bunny-excited{animation:bunnyJump .7s ease-in-out infinite}
@keyframes bunnyJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bunny-sad .tear{animation:tearFall 1.2s ease-in infinite}
@keyframes tearFall{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* ===== 音效（Web Audio 合成，无需外部资源） ===== */
let actx = null;
function audioCtx(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  return actx;
}
function tone(freq, start, dur, type, vol){
  const ctx = audioCtx(); if(!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, start + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(start); o.stop(start + dur + 0.05);
}
function sfx(name){
  if(!state.settings.sfx) return;
  const ctx = audioCtx(); if(!ctx) return;
  if(ctx.state === 'suspended'){ ctx.resume(); }
  const t = ctx.currentTime + 0.01;
  if(name === 'click'){ tone(620, t, 0.09, 'triangle', 0.12); }
  else if(name === 'right'){ tone(523.25, t, 0.12, 'triangle', 0.16); tone(783.99, t + 0.1, 0.16, 'triangle', 0.16); }
  else if(name === 'wrong'){ tone(329.63, t, 0.18, 'sine', 0.12); tone(261.63, t + 0.16, 0.24, 'sine', 0.12); }
  else if(name === 'win'){
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.13, 0.22, 'triangle', 0.16));
  }
  else if(name === 'coin'){ tone(987.77, t, 0.08, 'triangle', 0.14); tone(1318.5, t + 0.08, 0.16, 'triangle', 0.14); }
  else if(name === 'fail'){ tone(220, t, 0.3, 'sine', 0.12); tone(174.61, t + 0.22, 0.4, 'sine', 0.1); }
  else if(name === 'goal'){ [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, t + i * 0.1, 0.2, 'triangle', 0.15)); }
}
function unlockAudio(){ const ctx = audioCtx(); if(ctx && ctx.state === 'suspended'){ ctx.resume(); } }
document.addEventListener('pointerdown', unlockAudio, {once:true});

/* ===== 语音朗读（浏览器自带 TTS） ===== */
function speak(text){
  if(!state.settings.tts) return;
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.8; u.pitch = 1.15;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v => /zh[-_]CN/i.test(v.lang));
    if(zh){ u.voice = zh; }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ===== 答题闯关引擎 ===== */
let quiz = null;
let quizTimer = null;

function startQuiz(id){
  const lv = LEVELS.find(l => l.id === Number(id));
  if(!lv) return;
  const qs = pickN(lv.pool, 8).map(raw => {
    const opts = shuffle(raw.o.slice());
    const a = opts.indexOf(raw.o[raw.a]);
    return { t: raw.t, p: raw.p || '', pic: raw.pic || null, o: opts, a: a, x: raw.x || '' };
  });
  quiz = { lv: Number(id), qs: qs, idx: 0, hearts: 3, streak: 0, answered: false, picked: -1, correct: 0 };
  startQuizTimer();
}
function explainOf(q){
  if(q.x) return q.x;
  if(q.t === 'pic'){ return '这是“' + q.pic + '”字，读作 ' + PY[q.pic] + '。'; }
  if(q.t === 'py'){ const py = q.p.split(' ')[0]; return '“' + q.o[q.a] + '”读作 ' + py + '。'; }
  if(q.t === 'char'){ const ch = (q.p.match(/“(.+)”/) || [])[1] || ''; return '“' + ch + '”读作 ' + q.o[q.a] + '。'; }
  return '';
}
function speakQ(){
  if(!quiz) return;
  const q = quiz.qs[quiz.idx];
  if(!q) return;
  if(q.t === 'pic'){ speak(PY[q.pic] ? q.pic + '，' + PY[q.pic] : q.pic); }
  else if(q.t === 'py'){ const py = q.p.split(' ')[0]; speak(q.o[q.a] + '，' + py); }
  else if(q.t === 'char'){ const ch = (q.p.match(/“(.+)”/) || [])[1] || ''; speak(ch + '，' + q.o[q.a]); }
  else { speak(q.o[q.a]); }
}
const TYPE_LABEL = {pic:'看图认字', py:'拼音选字', char:'认字选拼音', fill:'课文填空', class:'火眼金睛', struct:'汉字魔法'};
function qContentHTML(q){
  if(q.t === 'pic'){ return '<div class="pic-box">' + PIC[q.pic] + '</div>'; }
  if(q.t === 'py'){ return '<div class="big-py">' + q.p.split(' ')[0] + '</div>' + '<button class="speak-btn" onclick="speakQ()">' + ICONS.speaker + ' 听一听</button>'; }
  if(q.t === 'char'){
    const ch = (q.p.match(/“(.+)”/) || [])[1] || '';
    return '<div class="big-char">' + ch + '</div>' + '<button class="speak-btn" onclick="speakQ()">' + ICONS.speaker + ' 听一听</button>';
  }
  if(q.t === 'fill' || q.t === 'struct'){ return '<div class="fill-sentence">' + q.p.replace('__', '<span class="blank"></span>') + '</div>'; }
  return '<div style="color:#F5C94C">' + ICONS.sparkle + '</div>';
}
function optMainHTML(q, i){
  const o = q.o[i];
  if(q.t === 'char'){ return '<span class="opt-py">' + o + '</span>'; }
  if(q.t === 'class'){ return '<span class="opt-char" style="font-size:36px;color:#8F76D6">' + o + '</span>'; }
  if(q.t === 'pic' || q.t === 'py'){ return '<span class="opt-char" style="color:#F26B9D">' + o + '</span>'; }
  return '<span class="opt-char">' + o + '</span>';
}
function feedbackHTML(q){
  const ok = quiz.picked === q.a;
  if(ok){
    return '<div class="feedback ok"><span class="fb-ico" style="color:#2E7D5C">' + ICONS.check + '</span><div class="fb-text"><div class="fb-title">答对啦，真棒！</div><div class="fb-tip">' + explainOf(q) + '</div></div></div>';
  }
  return '<div class="feedback bad"><span class="fb-ico" style="color:#A3482F">' + ICONS.close + '</span><div class="fb-text"><div class="fb-title">没关系，记住就好啦</div><div class="fb-tip">正确答案：' + q.o[q.a] + '。' + explainOf(q) + '</div></div></div>';
}
function quizHTML(){
  const lv = LEVELS.find(l => l.id === quiz.lv);
  const q = quiz.qs[quiz.idx];
  const hearts = [0,1,2].map(i => '<span style="color:#FF5F95"' + (i < quiz.hearts ? '' : ' class="lost"') + '>' + ICONS.heart + '</span>').join('');
  let opts = '';
  q.o.forEach((o, i) => {
    let cls = 'opt';
    if(quiz.answered){
      if(i === q.a){ cls += ' correct'; }
      else if(i === quiz.picked){ cls += ' wrong'; }
      else { cls += ' dim'; }
    }
    opts += '<button class="' + cls + '" onclick="answer(' + i + ')"' + (quiz.answered ? ' disabled' : '') + '>' +
      '<span class="opt-letter">' + String.fromCharCode(65 + i) + '</span>' +
      '<span class="opt-main">' + optMainHTML(q, i) + '</span>' +
    '</button>';
  });
  const prompt = (q.t === 'pic') ? '看一看，选出正确的字'
    : (q.t === 'py') ? '读一读，选出对应的字'
    : (q.t === 'char') ? q.p
    : (q.t === 'fill' || q.t === 'struct') ? ''
    : q.p;
  let bunnyMood = 'happy';
  let bunnySay = '加油，我看好你哦！';
  if(quiz.answered){
    if(quiz.picked === q.a){ bunnyMood = 'happy'; bunnySay = quiz.streak >= 3 ? '连对 ' + quiz.streak + ' 题啦，太厉害啦！' : '答对啦，兔兔给你点赞！'; }
    else { bunnyMood = 'sad'; bunnySay = '别灰心，记住这个字，下次一定行！'; }
  }
  const streakBadge = quiz.streak >= 2 ? '<span class="streak-badge">连对 ' + quiz.streak + ' 题</span>' : '';
  const nextBtn = quiz.answered
    ? (quiz.idx < quiz.qs.length - 1
        ? '<button class="btn btn-block" onclick="nextQ()">下一题</button>'
        : '<button class="btn btn-lemon btn-block" onclick="nextQ()">查看结果</button>')
    : '';
  return '' +
  '<div class="quiz-top">' +
    '<button class="icon-btn" onclick="quitQuiz()" aria-label="退出">' + ICONS.close + '</button>' +
    '<div class="qt-info"><div class="qt-unit">' + lv.unit + '</div><div class="qt-title">' + lv.title + '</div></div>' +
    '<div class="quiz-hearts">' + hearts + '</div>' +
  '</div>' +
  '<div class="quiz-progress"><div class="qp-fill" style="width:' + Math.round((quiz.idx + 1) / quiz.qs.length * 100) + '%"></div></div>' +
  '<div class="quiz-progress-label">第 ' + (quiz.idx + 1) + ' 题 / 共 ' + quiz.qs.length + ' 题</div>' +
  '<div class="q-card">' +
    '<span class="q-type">' + TYPE_LABEL[q.t] + '</span>' +
    '<div class="q-prompt">' + prompt + '</div>' +
    '<div class="q-content">' + qContentHTML(q) + '</div>' +
  '</div>' +
  '<div class="opt-grid">' + opts + '</div>' +
  (quiz.answered ? feedbackHTML(q) : '') +
  '<div class="quiz-bottom">' +
    nextBtn +
    '<div class="quiz-bunny">' +
      '<div class="mini-pet bunny-' + bunnyMood + '">' + bunnySVG(bunnyMood, state.equipped) + '</div>' +
      '<div class="qb-text">' + bunnySay + streakBadge + '</div>' +
    '</div>' +
  '</div>';
}
function renderQuizOnly(){
  const app = $('#app');
  if(app && quiz){ app.innerHTML = quizHTML(); }
}
function answer(i){
  if(!quiz || quiz.answered) return;
  quiz.answered = true;
  quiz.picked = i;
  const q = quiz.qs[quiz.idx];
  const ok = i === q.a;
  state.answered++;
  if(ok){
    state.correct++;
    quiz.streak++;
    quiz.correct++;
    sfx('right');
    if(quiz.streak === 3){ toast('连续答对 3 题，兔兔开心得转圈圈！', 'good'); }
    if(quiz.streak % 5 === 0){ confetti(18); }
  }else{
    quiz.streak = 0;
    quiz.hearts--;
    sfx('wrong');
    speak(q.o[q.a]);
  }
  saveState();
  renderQuizOnly();
}
function nextQ(){
  if(!quiz) return;
  if(quiz.idx < quiz.qs.length - 1){
    quiz.idx++;
    quiz.answered = false;
    quiz.picked = -1;
    renderQuizOnly();
  }else{
    finishQuiz();
  }
}
function finishQuiz(){
  if(!quiz) return;
  stopQuizTimer();
  const id = quiz.lv;
  if(quiz.hearts <= 0){ failQuiz(); return; }
  const starsEarned = quiz.hearts;
  const prev = levelStars(id);
  const coinsEarned = 10 + quiz.hearts * 5;
  const firstClear = prev === 0;
  const totalReward = coinsEarned + (firstClear ? 15 : 0);
  state.coins += totalReward;
  state.levels[id] = { stars: Math.max(prev, starsEarned) };
  recomputeTotalStars();
  saveState();
  sfx('win');
  confetti(50);
  const starsRow = '<div class="star-row">' + [0,1,2].map(i => '<span style="color:#F5C94C"' + (i < starsEarned ? '' : ' class="off"') + '>' + ICONS.star + '</span>').join('') + '</div>';
  const msg = starsEarned === 3 ? '三颗星！你是最棒的小学霸！'
    : starsEarned === 2 ? '两颗星！复习一下就能拿满星啦！'
    : '通关啦！再练一练，争取拿满星！';
  openModal(
    '<div class="m-ico" style="color:#F5C94C">' + ICONS.trophy + '</div>' +
    '<div class="m-title">闯关成功！</div>' +
    starsRow +
    '<div class="reward-line">' + ICONS.coin + ' 糖果 +' + totalReward + (firstClear ? '（含首通奖励 +15）' : '') + '</div>' +
    '<div class="m-text">' + msg + '</div>' +
    '<div class="m-actions">' +
      '<button class="btn" onclick="closeModal();go(\'map\')">回地图</button>' +
      '<button class="btn btn-grape" onclick="closeModal();startQuiz(' + id + ');renderQuizOnly()">再闯一次</button>' +
    '</div>'
  );
}
function failQuiz(){
  if(!quiz) return;
  stopQuizTimer();
  const id = quiz.lv;
  sfx('fail');
  openModal(
    '<div class="m-ico" style="color:#8A6A6A">' + ICONS.heart + '</div>' +
    '<div class="m-title">爱心用完啦</div>' +
    '<div class="m-text">没关系，兔兔陪你再试一次！\n多听多读，你一定可以的。</div>' +
    '<div class="m-actions">' +
      '<button class="btn" onclick="closeModal();startQuiz(' + id + ');renderQuizOnly()">再试一次</button>' +
      '<button class="btn btn-ghost" onclick="closeModal();go(\'map\')">回地图</button>' +
    '</div>'
  );
}
function quitQuiz(){
  if(!quiz) return;
  openModal(
    '<div class="m-ico" style="color:#8A6A6A">' + ICONS.flag + '</div>' +
    '<div class="m-title">要离开吗？</div>' +
    '<div class="m-text">闯关进度不会丢失，随时可以回来继续。</div>' +
    '<div class="m-actions">' +
      '<div class="m-row"><button class="btn btn-ghost" onclick="closeModal()">继续闯关</button><button class="btn" onclick="closeModal();go(\'map\')">离开</button></div>' +
    '</div>'
  );
}

/* ===== 学习计时与每日目标 ===== */
function startQuizTimer(){
  stopQuizTimer();
  quizTimer = setInterval(() => {
    if(document.visibilityState === 'visible'){
      state.todaySeconds++;
      if(state.todaySeconds % 60 === 0){ saveState(); }
      checkDailyGoal();
    }
  }, 1000);
}
function stopQuizTimer(){
  if(quizTimer){ clearInterval(quizTimer); quizTimer = null; }
  saveState();
}
function checkDailyGoal(){
  const min = state.settings.dailyMin;
  if(!state.claimed20 && state.todaySeconds >= min * 60){
    state.claimed20 = true;
    state.coins += 15;
    saveState();
    sfx('goal');
    confetti(36);
    openModal(
      '<div class="m-ico" style="color:#4FBF93">' + ICONS.clock + '</div>' +
      '<div class="m-title">今日目标达成！</div>' +
      '<div class="m-text">今天已经学习了 ' + min + ' 分钟，眼睛要休息一下啦。\n奖励糖果 +15！明天见～</div>' +
      '<div class="m-actions"><button class="btn btn-mint" onclick="closeModal()">知道啦</button></div>'
    );
  }
}

/* ===== 每日打卡 ===== */
function initDay(){
  const t = todayStr();
  if(state.lastDate !== t){
    const prev = state.lastDate;
    state.lastDate = t;
    state.todaySeconds = 0;
    state.claimed20 = false;
    state.dailyClaimed = false;
    state.streak = (prev === yesterdayStr()) ? state.streak + 1 : 1;
    state.coins += 10;
    state.dailyClaimed = true;
    saveState();
    setTimeout(() => { toast('今日打卡成功，糖果 +10！', 'good'); }, 800);
  }
}
function showWelcome(){
  if(state.welcome) return;
  state.welcome = true;
  saveState();
  setTimeout(() => {
    openModal(
      '<div style="width:130px;margin:0 auto 6px" class="bunny-happy">' + bunnySVG('happy', []) + '</div>' +
      '<div class="m-title">你好呀！我是糖糖</div>' +
      '<div class="m-text">欢迎来到糖糖语文乐园！\n和我一起闯关答题、收集星星，\n还能用糖果给我买漂亮衣服哦！</div>' +
      '<div class="m-actions"><button class="btn" onclick="closeModal()">开始冒险</button></div>'
    );
  }, 600);
}

/* ===== 启动 ===== */
function render(){
  const r = route();
  if(r.indexOf('quiz') !== 0){ stopQuizTimer(); }
  const app = $('#app');
  if(!app) return;
  if(r === 'home'){ app.innerHTML = homeHTML(); }
  else if(r === 'map'){ app.innerHTML = mapHTML(); }
  else if(r.indexOf('quiz') === 0){
    const id = Number(r.split('/')[1]);
    if(!quiz || quiz.lv !== id){ startQuiz(id); }
    app.innerHTML = quizHTML();
  }
  else if(r === 'dress'){ app.innerHTML = dressHTML(); }
  else if(r === 'settings'){ app.innerHTML = settingsHTML(); }
  else if(r === 'report'){ app.innerHTML = reportHTML(); }
  else { location.hash = '#/home'; return; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
window.addEventListener('pagehide', saveState);
document.addEventListener('visibilitychange', () => { if(document.hidden){ saveState(); } });

function init(){
  recomputeTotalStars();
  initDay();
  render();
  showWelcome();
}
init();

</script>
</body>
</html>
